version: 2
updates:
  # Minor and patch bumps land together, one PR a week per ecosystem rather
  # than one per dependency, each with a CI run of its own. A major arrives as
  # its own PR: it can change behavior, and red in the group it would hold back
  # every routine bump behind it.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "main"
    groups:
      npm:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # @dicebear/collection has no 10 and peers on @dicebear/core ^9, so core
      # 10 cannot be taken on its own (#341 failed to build). Remove this once
      # collection publishes a 10, and take the two together.
      - dependency-name: "@dicebear/core"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "main"
    groups:
      actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
