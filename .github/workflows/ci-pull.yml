name: CI - Pull Request
permissions:
  contents: read

on:
  pull_request:
    branches:
      - "**"

jobs:
  build:
    name: Build
    timeout-minutes: 15
    runs-on: ubuntu-latest

    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}

    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: pnpm/action-setup@v4.2.0
        with:
          version: 10.10.0

      - name: Setup Node.js environment
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm turbo build

  check:
    name: Check
    timeout-minutes: 15
    runs-on: ubuntu-latest

    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}

    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: pnpm/action-setup@v4.2.0
        with:
          version: 10.10.0

      - name: Setup Node.js environment
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Check
        run: pnpm turbo check

  typecheck:
    name: Typecheck
    timeout-minutes: 15
    runs-on: ubuntu-latest

    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}

    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: pnpm/action-setup@v4.2.0
        with:
          version: 10.10.0

      - name: Setup Node.js environment
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Typecheck
        run: pnpm typecheck

  test:
    name: Test
    timeout-minutes: 15
    runs-on: ubuntu-latest

    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}

    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: pnpm/action-setup@v4.2.0
        with:
          version: 10.10.0

      - name: Setup Node.js environment
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Test
        run: pnpm turbo test

  worker:
    name: Worker Runtime
    timeout-minutes: 15
    runs-on: ubuntu-latest

    env:
      WRANGLER_SEND_METRICS: "false"

    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: pnpm/action-setup@v4.2.0
        with:
          version: 10.10.0

      - name: Setup Node.js environment
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      # `pnpm dev:api` runs on workerd, so the Workers build is exercised
      # constantly in development but was never built or booted outside a
      # developer's machine.
      - name: Check Cloudflare Workers build
        run: ./scripts/check-worker-runtime.sh

  container:
    name: Container Image
    timeout-minutes: 25
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      # The API and dashboard share one process; that static-serving path runs
      # in neither `pnpm dev` nor the unit tests, so the image is the only
      # place it executes.
      - name: Smoke test the all-in-one image
        run: ./scripts/check-container-image.sh

  e2e:
    name: End-to-End
    timeout-minutes: 20
    runs-on: ubuntu-latest

    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}

    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: pnpm/action-setup@v4.2.0
        with:
          version: 10.10.0

      - name: Setup Node.js environment
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      # Covers what the unit tests structurally cannot: static serving, the SPA
      # fallback, the `/v1` 404 boundary, and the dashboard rendering against a
      # real API.
      #
      # `test:e2e:all` also brings up Postgres and PostgREST via compose and
      # runs the contract specs a second time against the Supabase connector.
      # That parity pass is the point of the job: libSQL and Supabase are two
      # implementations of one interface, and the types they disagree about
      # (JSONB, TIMESTAMPTZ, BOOLEAN, TEXT[]) are converted by hand in
      # `connectors/libsql/rows.ts`. Running one suite against both is what
      # proves the translation is faithful rather than merely self-consistent.
      - name: Run end-to-end tests against both storage backends
        run: pnpm test:e2e:all

      - name: Upload the report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ github.job }}
          path: |
            playwright-report/
            e2e-results/
          retention-days: 7

      - name: Stop Postgres and PostgREST
        if: always()
        run: scripts/e2e-postgres.sh down

  # Coverage on a pull request: the report is an artifact to download, not a
  # Pages deploy. Only main publishes, so a PR cannot overwrite the badge with
  # a number that was never merged.
  coverage:
    name: Coverage
    timeout-minutes: 20
    runs-on: ubuntu-latest

    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}

    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: pnpm/action-setup@v4.2.0
        with:
          version: 10.10.0

      - name: Setup Node.js environment
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Run tests with coverage
        run: pnpm test:coverage

      - name: Report the line coverage
        run: |
          set -euo pipefail
          node -p "'Line coverage: ' + require('./coverage/coverage-summary.json').total.lines.pct + '%'" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            coverage/index.html
            coverage/lcov.info
          retention-days: 14

  migrations:
    name: Test Migrations
    timeout-minutes: 10
    runs-on: ubuntu-latest

    steps:
      - name: Check out PR branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          path: pr

      - name: Check out base branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.base_ref }}
          path: base

      - name: Verify existing migrations unchanged
        run: |
          echo "Comparing migration checksums between base and PR branch..."

          # Get checksums of migrations in base branch
          if [ -d "base/supabase/migrations" ]; then
            cd base/supabase/migrations
            find . -name "*.sql" -type f | sort | while read file; do
              sha256sum "$file"
            done > /tmp/base_checksums.txt
            cd - > /dev/null
          else
            touch /tmp/base_checksums.txt
          fi

          # Check each base migration exists unchanged in PR
          changed_migrations=""
          while read checksum filename; do
            [ -z "$checksum" ] && continue
            pr_file="pr/supabase/migrations/$filename"
            if [ -f "$pr_file" ]; then
              pr_checksum=$(sha256sum "$pr_file" | cut -d' ' -f1)
              if [ "$checksum" != "$pr_checksum" ]; then
                changed_migrations="$changed_migrations\n  - $filename"
              fi
            else
              changed_migrations="$changed_migrations\n  - $filename (deleted)"
            fi
          done < /tmp/base_checksums.txt

          if [ -n "$changed_migrations" ]; then
            echo "ERROR: Existing migrations were modified or deleted!"
            echo "Changed migrations:$changed_migrations"
            echo ""
            echo "Migrations are immutable once merged. Create a new migration instead."
            exit 1
          fi

          echo "All existing migrations unchanged. Checking for new migrations..."

          # List new migrations
          cd pr/supabase/migrations
          find . -name "*.sql" -type f | sort | while read file; do
            if ! grep -q "$file" /tmp/base_checksums.txt 2>/dev/null; then
              echo "  New migration: $file"
            fi
          done

          echo "Migration integrity check passed!"

      - name: Test migrations with docker-compose
        working-directory: pr
        run: |
          # Start postgres and run migrations
          docker compose up -d postgres

          # Wait for postgres to be healthy
          echo "Waiting for PostgreSQL to be ready..."
          timeout 60 sh -c 'until docker compose exec -T postgres pg_isready -U postgres; do sleep 2; done'

          # Run migrations container
          docker compose up migrations

          # Check migrations container exit code
          exit_code=$(docker compose ps -a migrations --format json | jq -r 'if type == "array" then .[0].ExitCode else .ExitCode end // 0')
          if [ "$exit_code" != "0" ]; then
            echo "ERROR: Migrations failed with exit code $exit_code"
            docker compose logs migrations
            exit 1
          fi

          echo "Migrations completed successfully!"

      - name: Verify migrations applied
        working-directory: pr
        run: |
          # Count applied migrations
          applied_count=$(docker compose exec -T postgres psql -U postgres -d postgres -tAc \
            "SELECT COUNT(*) FROM schema_migrations")

          # Count migration files
          file_count=$(find supabase/migrations -name "*.sql" -type f | wc -l)

          echo "Applied migrations: $applied_count"
          echo "Migration files: $file_count"

          if [ "$applied_count" -ne "$file_count" ]; then
            echo "ERROR: Migration count mismatch!"
            docker compose logs migrations
            exit 1
          fi

          # Show applied migrations
          echo ""
          echo "Applied migrations:"
          docker compose exec -T postgres psql -U postgres -d postgres -c \
            "SELECT version, applied_at FROM schema_migrations ORDER BY version"

          echo ""
          echo "All migrations applied successfully!"

      - name: Cleanup
        if: always()
        working-directory: pr
        run: docker compose down -v
