name: Build
permissions:
  contents: read

on:
  push:
    branches:
      - "main"

jobs:
  build:
    name: Build
    timeout-minutes: 15
    runs-on: ubuntu-latest

    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}

    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: pnpm/action-setup@v4.2.0
        with:
          version: 10.10.0

      - name: Setup Node.js environment
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm turbo build

  check:
    name: Check
    timeout-minutes: 15
    runs-on: ubuntu-latest

    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}

    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: pnpm/action-setup@v4.2.0
        with:
          version: 10.10.0

      - name: Setup Node.js environment
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Check
        run: pnpm turbo check

  typecheck:
    name: Typecheck
    timeout-minutes: 15
    runs-on: ubuntu-latest

    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}

    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: pnpm/action-setup@v4.2.0
        with:
          version: 10.10.0

      - name: Setup Node.js environment
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Typecheck
        run: pnpm typecheck

  test:
    name: Test
    timeout-minutes: 15
    runs-on: ubuntu-latest

    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}

    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: pnpm/action-setup@v4.2.0
        with:
          version: 10.10.0

      - name: Setup Node.js environment
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Test
        run: pnpm turbo test

  worker:
    name: Worker Runtime
    timeout-minutes: 15
    runs-on: ubuntu-latest

    env:
      WRANGLER_SEND_METRICS: "false"

    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: pnpm/action-setup@v4.2.0
        with:
          version: 10.10.0

      - name: Setup Node.js environment
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      # `pnpm dev:api` runs on workerd, so the Workers build is exercised
      # constantly in development but was never built or booted outside a
      # developer's machine.
      - name: Check Cloudflare Workers build
        run: ./scripts/check-worker-runtime.sh

  container:
    name: Container Image
    timeout-minutes: 25
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      # The API and dashboard share one process; that static-serving path runs
      # in neither `pnpm dev` nor the unit tests, so the image is the only
      # place it executes.
      - name: Smoke test the all-in-one image
        run: ./scripts/check-container-image.sh

  e2e:
    name: End-to-End
    timeout-minutes: 20
    runs-on: ubuntu-latest

    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}

    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: pnpm/action-setup@v4.2.0
        with:
          version: 10.10.0

      - name: Setup Node.js environment
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      # Covers what the unit tests structurally cannot: static serving, the SPA
      # fallback, the `/v1` 404 boundary, and the dashboard rendering against a
      # real API.
      #
      # `test:e2e:all` also brings up Postgres and PostgREST via compose and
      # runs the contract specs a second time against the Supabase connector.
      # That parity pass is the point of the job: libSQL and Supabase are two
      # implementations of one interface, and the types they disagree about
      # (JSONB, TIMESTAMPTZ, BOOLEAN, TEXT[]) are converted by hand in
      # `connectors/libsql/rows.ts`. Running one suite against both is what
      # proves the translation is faithful rather than merely self-consistent.
      - name: Run end-to-end tests against both storage backends
        run: pnpm test:e2e:all

      - name: Upload the report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.job }}
          path: |
            playwright-report/
            e2e-results/
          retention-days: 7

      - name: Stop Postgres and PostgREST
        if: always()
        run: scripts/e2e-postgres.sh down

  # Publishes the browsable HTML coverage report to GitHub Pages, and writes a
  # shields.io "endpoint" JSON beside it so the README badge reads the current
  # line-% straight from Pages -- no Gist, no PAT, no third-party service.
  #
  # One-time repo setup: Settings -> Pages -> Source = "GitHub Actions".
  # Served at https://jorge-menjivar.github.io/super-agents/.
  #
  # This is unit-test coverage only. The end-to-end suite runs a built bundle in
  # a separate process, so v8 cannot instrument it and it contributes nothing to
  # this number -- see e2e/README.md for what it covers instead.
  coverage-pages:
    name: Coverage (Pages)
    timeout-minutes: 20
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    # Serialize deploys; never cancel an in-flight Pages deployment.
    concurrency:
      group: pages
      cancel-in-progress: false

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}

    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: pnpm/action-setup@v4.2.0
        with:
          version: 10.10.0

      - name: Setup Node.js environment
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Run tests with coverage
        run: pnpm test:coverage

      - name: Write the badge endpoint JSON
        run: |
          set -euo pipefail
          pct=$(node -p "require('./coverage/coverage-summary.json').total.lines.pct")
          if   awk "BEGIN{exit !($pct>=90)}"; then color=brightgreen
          elif awk "BEGIN{exit !($pct>=75)}"; then color=green
          elif awk "BEGIN{exit !($pct>=60)}"; then color=yellow
          elif awk "BEGIN{exit !($pct>=40)}"; then color=orange
          else color=red
          fi
          printf '{"schemaVersion":1,"label":"coverage","message":"%.1f%%","color":"%s"}\n' \
            "$pct" "$color" > coverage/coverage.json
          cat coverage/coverage.json

      # The `lcov` reporter renders a second copy of the same HTML here. Keep
      # `lcov.info` for anything external, drop the duplicate report.
      - name: Trim the duplicate report
        run: rm -rf coverage/lcov-report

      - name: Upload the lcov report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          retention-days: 14

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: coverage

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  migrations:
    name: Test Migrations
    timeout-minutes: 10
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Test migrations with docker-compose
        run: |
          # Start postgres and run migrations
          docker compose up -d postgres

          # Wait for postgres to be healthy
          echo "Waiting for PostgreSQL to be ready..."
          timeout 60 sh -c 'until docker compose exec -T postgres pg_isready -U postgres; do sleep 2; done'

          # Run migrations container
          docker compose up migrations

          # Check migrations container exit code
          exit_code=$(docker compose ps -a migrations --format json | jq -r 'if type == "array" then .[0].ExitCode else .ExitCode end // 0')
          if [ "$exit_code" != "0" ]; then
            echo "ERROR: Migrations failed with exit code $exit_code"
            docker compose logs migrations
            exit 1
          fi

          echo "Migrations completed successfully!"

      - name: Verify migrations applied
        run: |
          # Count applied migrations
          applied_count=$(docker compose exec -T postgres psql -U postgres -d postgres -tAc \
            "SELECT COUNT(*) FROM schema_migrations")

          # Count migration files
          file_count=$(find supabase/migrations -name "*.sql" -type f | wc -l)

          echo "Applied migrations: $applied_count"
          echo "Migration files: $file_count"

          if [ "$applied_count" -ne "$file_count" ]; then
            echo "ERROR: Migration count mismatch!"
            docker compose logs migrations
            exit 1
          fi

          # Show applied migrations
          echo ""
          echo "Applied migrations:"
          docker compose exec -T postgres psql -U postgres -d postgres -c \
            "SELECT version, applied_at FROM schema_migrations ORDER BY version"

          echo ""
          echo "All migrations applied successfully!"

      - name: Cleanup
        if: always()
        run: docker compose down -v
